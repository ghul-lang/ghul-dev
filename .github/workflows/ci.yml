name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

  merge_group:

env:
  CI: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      run: npm ci

    - name: Test
      run: npm test

    - name: Build site
      run: npm run build

  examples:
    name: Test examples
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Restore .NET tools
      run: dotnet tool restore

    # The default configuration in ghul-test.json runs the compiler the tool
    # manifest pins, and the runtime example-tool pins, from the package cache:
    # the versions under test when a dependency update proposes new ones. The
    # restore puts that runtime in the cache.
    - name: Restore the pinned runtime
      run: dotnet restore example-tool

    - name: Compile and run every example
      run: dotnet ghul-test example-tests

    # The examples are what the site teaches, so they are written in the
    # terminator-free style the compiler infers. A `;` a line break would
    # infer anyway is the compiler's own redundant-semicolon warning, but
    # nothing compiles an example through a project file to enable it.
    - name: Check no example writes a terminator the compiler infers
      run: |
        if grep -rn ';$' examples snippets --include='*.ghul' ; then
            echo "the lines above end with a statement terminator the compiler infers" >&2
            exit 1
        fi

